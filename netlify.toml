[build]
  command = "npm ci --include=dev && npm run build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  NODE_ENV = "development"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/**", "apps/api/prisma/**"]

# Redirect API requests to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React Router SPA fallback for single page application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
