services:
  postgres:
    image: postgres:15-alpine
    container_name: candidate_tracker_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: candidate_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d candidate_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
